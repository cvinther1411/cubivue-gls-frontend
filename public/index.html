<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLS Locations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <form id="search-form" autocomplete="off">
    <input id="search-input" type="text" placeholder="Search for an address or city…" />
    <button id="search-button" type="submit">Search</button>
    <span id="search-spinner" class="spinner hidden" aria-label="Searching…"></span>
  </form>
  <ul id="search-results" class="hidden"></ul>

  <div id="status-bar">
    <span id="locations-spinner" class="spinner hidden" aria-label="Loading locations…"></span>
    <span id="status-text">Loading map…</span>
  </div>

  <div id="layer-toggles">
    <label>
      <input type="checkbox" id="voronoi-toggle" />
      Show Voronoi areas
    </label>
  </div>

  <div id="zoom-overlay" class="hidden">
    <div id="zoom-overlay-inner">
      <strong>Zoom in to see locations</strong>
      <div id="zoom-overlay-detail"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
